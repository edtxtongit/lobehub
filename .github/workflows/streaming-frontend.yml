name: Streaming Frontend Verification

on:
  push:
    branches: [perf/streaming-silky]

permissions:
  contents: write

concurrency:
  group: streaming-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streaming-frontend:
    name: Mock AI stream + SPA build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Download and apply submitted patch
        run: |
          curl -fsSL https://app.lobehub.com/f/file_H76pCVkX2fga -o /tmp/streaming.patch
          git apply --check /tmp/streaming.patch
          git apply /tmp/streaming.patch

      - name: Add correctness fixes and focused regressions
        run: |
          python3 <<PY
          from pathlib import Path

          p = Path("packages/conversation-flow/src/incremental.ts")
          s = p.read_text()
          s = s.replace(
              "  // `reasoning` is absent on plain text turns; don\x27t invent the key.\n  if (\x27reasoning\x27 in delta && delta.reasoning !== undefined) next.reasoning = delta.reasoning;",
              "  // Remove stale reasoning when a later snapshot clears the chain.\n  if (delta.reasoning !== undefined) next.reasoning = delta.reasoning;\n  else delete next.reasoning;",
          )
          p.write_text(s)

          p = Path("src/store/chat/agents/StreamingHandler.ts")
          s = p.read_text()
          s = s.replace(
              "  async handleFinish(finishData: FinishData): Promise<StreamingResult> {\n    // Update traceId",
              "  async handleFinish(finishData: FinishData): Promise<StreamingResult> {\n    // Flush pure text, abort and error paths as well as tool-call paths.\n    this.throttledContentUpdate.flush();\n\n    // Update traceId",
          )
          p.write_text(s)

          p = Path("src/store/chat/agents/StreamingHandler.test.ts")
          s = p.read_text()
          old = """    it(\x27should accumulate text output\x27, () => {
              const callbacks = createMockCallbacks();
              const handler = new StreamingHandler(mockContext, callbacks);

              handler.handleChunk({ type: \x27text\x27, text: \x27Hello \x27 });
              handler.handleChunk({ type: \x27text\x27, text: \x27World\x27 });

              expect(handler.getOutput()).toBe(\x27Hello World\x27);
              expect(callbacks.onContentUpdate).toHaveBeenCalledTimes(2);
            });"""
          new = """    it(\x27should throttle a mock AI reply and flush its final text\x27, async () => {
              vi.useFakeTimers();
              const callbacks = createMockCallbacks();
              const handler = new StreamingHandler(mockContext, callbacks);

              handler.handleChunk({ type: \x27text\x27, text: \x27Hello \x27 });
              handler.handleChunk({ type: \x27text\x27, text: \x27World\x27 });

              expect(handler.getOutput()).toBe(\x27Hello World\x27);
              expect(callbacks.onContentUpdate).toHaveBeenCalledTimes(1);
              await handler.handleFinish({ type: \x27stop\x27 });
              expect(callbacks.onContentUpdate).toHaveBeenCalledTimes(2);
              expect(callbacks.onContentUpdate).toHaveBeenLastCalledWith(\x27Hello World\x27, undefined);
              vi.useRealTimers();
            });"""
          if old not in s:
              raise SystemExit("StreamingHandler test anchor not found")
          p.write_text(s.replace(old, new))

          p = Path("packages/conversation-flow/src/__tests__/incremental.test.ts")
          s = p.read_text()
          anchor = "  describe(\x27falls back (returns undefined) on structural change\x27, () => {"
          test = """  it(\x27clears stale reasoning when the next snapshot omits it\x27, () => {
              const prev = [msg(0), msg(1, { reasoning: { content: \x27thinking...\x27 } })];
              const next = prev.map((m) =>
                m.id === \x27msg-1\x27
                  ? { ...m, content: \x27answer\x27, reasoning: undefined, updatedAt: at(999) }
                  : m,
              );
              const { patched } = expectEquivalentToFullParse(prev, next);
              expect(patched.at(-1)).not.toHaveProperty(\x27reasoning\x27);
            });

          """
          if anchor not in s:
              raise SystemExit("incremental test anchor not found")
          p.write_text(s.replace(anchor, test + anchor))
          PY

      - name: Remove one-shot workflow and commit tested source
        run: |
          git rm .github/workflows/streaming-frontend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/conversation-flow/src src/features/Conversation src/store/chat/agents src/store/chat/slices/message/actions
          git commit -m "perf: optimize streaming conversation updates [skip ci]"
          git push origin HEAD:perf/streaming-silky

      - name: Install dependencies
        run: pnpm install

      - name: Test conversation-flow incrementals
        run: bun run --filter @lobechat/conversation-flow test --run

      - name: Test mocked AI streaming frontend path
        run: bunx vitest run src/store/chat/agents/StreamingHandler.test.ts src/store/chat/agents/__tests__/clientRuntimeExecutors/call-llm.test.ts

      - name: Build browser SPA
        run: bun run build:spa:raw
        env:
          SKIP_LINT: "1"

      - name: Upload browser build
        uses: actions/upload-artifact@v6
        with:
          name: streaming-frontend-spa
          path: dist
          retention-days: 3
