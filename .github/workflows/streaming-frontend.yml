name: Streaming Frontend Verification

on:
  push:
    branches: [perf/streaming-silky]

permissions:
  contents: write

concurrency:
  group: streaming-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streaming-frontend:
    name: Mock AI stream + SPA build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Apply submitted patch
        run: |
          curl -fsSL https://app.lobehub.com/f/file_H76pCVkX2fga -o /tmp/streaming.patch
          git apply --check /tmp/streaming.patch
          git apply /tmp/streaming.patch
          git diff --check

      - name: Commit patch and delete one-shot workflow
        run: |
          git rm .github/workflows/streaming-frontend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/conversation-flow/src src/features/Conversation src/store/chat
          git commit -m "perf: optimize streaming conversation updates [skip ci]"
          git push origin HEAD:perf/streaming-silky

      - name: Install dependencies
        run: pnpm install

      - name: Test conversation-flow incremental rendering
        run: bun run --filter @lobechat/conversation-flow test --run

      - name: Test mocked AI reply path
        run: bunx vitest run src/store/chat/agents/__tests__/clientRuntimeExecutors/call-llm.test.ts

      - name: Build browser SPA
        run: bun run build:spa:raw
        env:
          SKIP_LINT: "1"

      - name: Upload browser build
        uses: actions/upload-artifact@v6
        with:
          name: streaming-frontend-spa
          path: dist
          retention-days: 3
